# Beta web process: Nixpacks supplies Laravel's Nginx and PHP-FPM start command.
# Do not add migrations, queue workers, or scheduler processes to this image.

[variables]
PORT = "80"
NIXPACKS_PHP_ROOT_DIR = "/app/public"
NIXPACKS_PHP_FALLBACK_PATH = "/index.php"

[phases.setup]
# Includes PHP 8.4.27: fixes CVE-2026-109618 and CVE-2026-109619.
# Also includes Nix's fix to load ext-filter in the CGI subprocess tests.
nixpkgsArchive = "a5fc1be5b6c2d0c934143b57363aef9a15cce508"

[phases.build]
cmds = [
    "php -r 'if (PHP_VERSION_ID < 80427 || PHP_VERSION_ID >= 80500) { fwrite(STDERR, \"PHP 8.4.27 or a newer 8.4 security release is required.\\n\"); exit(1); }'",
    "composer check-platform-reqs --no-dev",
    "npm run build",
    "mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache",
    "rm -rf public/storage && ln -s ../storage/app/public public/storage",
    "chown -R $(id -u nobody):$(id -g nobody) storage bootstrap/cache",
    "chmod -R u+rwX,g+rwX storage bootstrap/cache"
]

[staticAssets]
"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = nobody
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
security.limit_extensions = .php
php_admin_flag[session.upload_progress.enabled] = off
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_value[cgi.fix_pathinfo] = 0
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 64M
'''

"nginx.template.conf" = '''
worker_processes 2;
daemon off;

worker_rlimit_nofile 8192;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include $!{nginx}/conf/mime.types;
    index index.html index.htm index.php;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] $status '
        '"$request" $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    server_names_hash_bucket_size 128;

    server {
        listen ${PORT};
        listen [::]:${PORT};
        server_name localhost;

        root ${NIXPACKS_PHP_ROOT_DIR};
        client_max_body_size 64m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        index index.php;
        charset utf-8;

        # Static SysPilot workbench; do not fall back to Laravel's PHP index.
        location = /syspilot {
            return 301 /syspilot/;
        }

        location = /syspilot/ {
            rewrite ^ /syspilot/index.html last;
        }

        location / {
            try_files $uri $uri/ ${NIXPACKS_PHP_FALLBACK_PATH}?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ ^/(index|game_sim)\.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include $!{nginx}/conf/fastcgi_params;
            include $!{nginx}/conf/fastcgi.conf;
        }

        location ~* \.(?:php|phtml|phar)(?:/|$) {
            return 404;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
'''
