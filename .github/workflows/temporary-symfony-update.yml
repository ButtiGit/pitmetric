name: Temporary Symfony lockfile refresh

on:
  push:
    branches:
      - feat/calendar-inbox

permissions:
  contents: write

jobs:
  update-lockfile:
    if: contains(github.event.head_commit.message, '[refresh-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/calendar-inbox
          persist-credentials: true

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4.27'
          tools: composer:v2
          coverage: none

      - name: Update only affected Symfony dependencies
        run: composer update symfony/http-foundation symfony/http-kernel symfony/routing symfony/serializer symfony/yaml --with-all-dependencies --no-interaction --no-progress --no-scripts --no-plugins

      - name: Recheck security advisories
        run: composer audit --locked

      - name: Commit updated lockfile to feature branch
        run: |
          git config user.name 'PitMetric CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update vulnerable Symfony dependencies'
            git push origin HEAD:feat/calendar-inbox
          fi
