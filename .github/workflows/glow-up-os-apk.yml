name: Fetch APK signer

on:
  push:
    branches:
      - glow-up-os-apk-build

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signer
        run: |
          curl -L --fail --retry 3 https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o uber-apk-signer.jar
          sha256sum uber-apk-signer.jar
      - uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer
          path: uber-apk-signer.jar
          retention-days: 1
