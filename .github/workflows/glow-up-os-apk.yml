name: Build Glow Up OS v0.2 APK

on:
  push:
    branches:
      - glow-up-os-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore v0.1 source
        run: |
          cat .glow-build/source.b64.* | base64 -d > /tmp/glow-base.zip
          mkdir -p /tmp/glow-up-os
          unzip -q /tmp/glow-base.zip -d /tmp/glow-up-os
      - name: Apply v0.2 overlay
        run: |
          cat .glow-v02/source.b64.* | base64 -d > /tmp/glow-overlay.zip
          unzip -t /tmp/glow-overlay.zip
          unzip -qo /tmp/glow-overlay.zip -d /tmp/glow-up-os
      - name: Validate JavaScript
        run: node --check /tmp/glow-up-os/app/src/main/assets/app.js
      - name: Build debug APK
        working-directory: /tmp/glow-up-os
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp /tmp/glow-up-os/app/build/outputs/apk/debug/app-debug.apk GlowUpOS-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlowUpOS-v0.2-APK
          path: GlowUpOS-v0.2-debug.apk
          retention-days: 7
