name: Build Glow Up OS APK

on:
  push:
    branches:
      - glow-up-os-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Glow Up OS project
        run: |
          mkdir -p /tmp/glow-up-os
          unzip -q glow-up-os-src.zip -d /tmp/glow-up-os
      - name: Build debug APK
        working-directory: /tmp/glow-up-os
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp /tmp/glow-up-os/app/build/outputs/apk/debug/app-debug.apk GlowUpOS-v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GlowUpOS-APK
          path: GlowUpOS-v0.1-debug.apk
          retention-days: 7
