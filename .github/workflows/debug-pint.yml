name: debug-pint

on:
  push:
    branches:
      - feature/timing-telemetry-workspace

permissions:
  contents: read

jobs:
  pint-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Show Pint changes
        run: |
          vendor/bin/pint app/Services/TelemetryImportService.php
          git diff -- app/Services/TelemetryImportService.php
