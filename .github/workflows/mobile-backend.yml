name: mobile-backend

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/MobileAppController.php'
      - 'app/Http/Middleware/AuthenticateMobileToken.php'
      - 'app/Models/GalleryAsset.php'
      - 'app/Models/MobileAccessToken.php'
      - 'bootstrap/app.php'
      - 'routes/api.php'
      - 'tests/Feature/MobileAppApiTest.php'
      - 'database/migrations/*mobile_app_tables.php'
      - '.github/workflows/mobile-backend.yml'

permissions:
  contents: read

jobs:
  backend-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer setup
      - name: Pint
        run: composer lint:check
      - name: PHPStan
        id: phpstan
        continue-on-error: true
        run: composer types:check 2>&1 | tee phpstan.log
      - name: Mobile API tests
        id: mobile_tests
        continue-on-error: true
        run: php artisan test --compact tests/Feature/MobileAppApiTest.php 2>&1 | tee mobile-tests.log
      - name: Full Laravel tests
        id: full_tests
        continue-on-error: true
        run: php artisan test --compact 2>&1 | tee full-tests.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            phpstan.log
            mobile-tests.log
            full-tests.log
      - name: Fail on backend errors
        if: steps.phpstan.outcome == 'failure' || steps.mobile_tests.outcome == 'failure' || steps.full_tests.outcome == 'failure'
        run: exit 1
