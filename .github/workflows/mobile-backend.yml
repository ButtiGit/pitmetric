name: mobile-backend

on:
  pull_request:
    paths:
      - 'app/Http/Controllers/MobileAppController.php'
      - 'app/Http/Middleware/AuthenticateMobileToken.php'
      - 'app/Models/GalleryAsset.php'
      - 'app/Models/MobileAccessToken.php'
      - 'bootstrap/app.php'
      - 'routes/api.php'
      - 'tests/Feature/MobileAppApiTest.php'
      - 'database/migrations/*mobile_app_tables.php'
      - '.github/workflows/mobile-backend.yml'

permissions:
  contents: write

jobs:
  backend-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer setup
      - name: Apply Pint formatting
        run: |
          ./vendor/bin/pint app/Http/Controllers/MobileAppController.php
          if ! git diff --quiet -- app/Http/Controllers/MobileAppController.php; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/Http/Controllers/MobileAppController.php
            git commit -m 'Apply Pint formatting to mobile controller'
            git push origin HEAD:${{ github.head_ref }}
          fi
