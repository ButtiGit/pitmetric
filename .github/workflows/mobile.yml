name: mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/Http/Controllers/MobileAppController.php'
      - 'app/Http/Middleware/AuthenticateMobileToken.php'
      - 'app/Models/GalleryAsset.php'
      - 'app/Models/MobileAccessToken.php'
      - 'routes/api.php'
      - 'database/migrations/*mobile_app_tables.php'
  push:
    branches: [main]
    paths: ['mobile/**']

permissions:
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
