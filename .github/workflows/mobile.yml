name: mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'app/Http/Controllers/MobileAppController.php'
      - 'app/Http/Middleware/AuthenticateMobileToken.php'
      - 'app/Models/GalleryAsset.php'
      - 'app/Models/MobileAccessToken.php'
      - 'routes/api.php'
      - 'database/migrations/*mobile_app_tables.php'
  push:
    branches: [main]
    paths: ['mobile/**']

permissions:
  contents: read

jobs:
  build-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:pwa
      - run: npm run build
      - run: npm run build:pwa

  pwa-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm --prefix mobile install
      - run: npm --prefix mobile run build:pwa
        env:
          VITE_PITMETRIC_API_URL: http://127.0.0.1:4174/api/mobile
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config mobile/playwright.config.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pwa-browser-failure
          path: mobile/test-results/
          retention-days: 7
