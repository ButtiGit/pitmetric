name: Repair npm lockfile

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-npm-lock.yml'

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Validate clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync npm lockfile with package manifest"
          git push
