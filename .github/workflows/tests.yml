name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Inspect Pint formatting
        run: |
          ./vendor/bin/pint database/migrations/2026_09_17_070000_enforce_workspace_relationship_integrity.php
          cat database/migrations/2026_09_17_070000_enforce_workspace_relationship_integrity.php
          exit 1

      - name: Validate standalone game
        run: |
          php -l public/game_sim.php
          node --check public/game_assets/game_data_2026.js
          node --check public/game_assets/game_sim.js

      - name: Run CI Checks
        run: composer ci:check
